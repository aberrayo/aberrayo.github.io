<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Tic Tac Toe</h1>
      <section class="controls">
        <button id="resetBtn" aria-label="Reset game">Reset</button>
        <div id="status" role="status" aria-live="polite"></div>
      </section>
      <section class="board" role="grid" aria-label="Tic Tac Toe board"></section>
      <section class="scoreboard">
        <div>Player X: <span id="scoreX">0</span></div>
        <div>Player O: <span id="scoreO">0</span></div>
        <div>Draws: <span id="scoreD">0</span></div>
      </section>
    </main>
    <script src="script.js" type="module"></script>
  </body>
</html>
